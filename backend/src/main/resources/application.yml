# WFM Application - Main Configuration
spring:
  application:
    name: wfm-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wfm_db}
    username: ${DB_USERNAME:wfm_user}
    password: ${DB_PASSWORD:wfm_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: WFM-HikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.wfm: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

# ===================== WFM Application Config =====================
wfm:
  security:
    jwt:
      secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production-this-must-be-at-least-256-bits}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}         # 24 hours
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  optimization:
    default-time-limit-seconds: 120
    default-solution-limit: 1000
    max-consecutive-work-days: 6
    min-rest-hours-between-shifts: 11
    max-daily-work-hours: 9
    weekly-off-days-count: 2
    weights:
      coverage-shortage: 1000
      morning-preference: 50
      weekly-off-preference: 80
      night-concentration: 40
      weekend-imbalance: 60
      overtime: 100
      shift-change: 30
      workload-imbalance: 70
      preferred-shift-movement: 90

  scheduling:
    tie-breaking-strategy: ROSTER_CONTINUITY  # ROSTER_CONTINUITY | MANAGEMENT_COVERAGE | PREFERENCE | WFM_DECISION
    preference-window-open-day: MONDAY
    preference-window-open-time: "09:00"
    preference-window-close-day: TUESDAY
    preference-window-close-time: "11:00"
    tl-review-open-day: TUESDAY
    tl-review-open-time: "12:00"
    tl-review-close-day: THURSDAY
    tl-review-close-time: "10:00"

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
